    <meta charset="UTF-8" />

    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="index.html"><span class="brand-mark">A3</span><span><strong>AOW3</strong><small>Community Wiki</small></span></a>
        <nav class="main-nav" aria-label="Главная навигация"><a href="wiki.html">Wiki</a><a class="active" href="videos.html">Видео</a><a href="lore.html">Лор</a><a href="community.html">Сообщество</a></nav>

      <main>
        <section class="page-hero"><h1>Видео</h1><p>Все наши видео, удобно разбитые по категориям!</p></section>

            <div class="video-embed"><iframe id="video-player" src="https://www.youtube.com/embed/jNQXAC9IVRw" title="YouTube video player" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
            <div class="section-heading"><div><h2 id="video-category-title">Обучающие</h2></div></div>
